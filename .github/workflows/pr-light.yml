name: pr-light
on:
  pull_request:
jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npm run build
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # postgresql must be installed before `cmake --preset dev` so CMake finds
      # initdb/pg_ctl/psql and registers local async-job integration tests.
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ninja-build libjsoncpp-dev libdrogon-dev uuid-dev libmariadb-dev libbrotli-dev libhiredis-dev libyaml-cpp-dev libgtest-dev postgresql postgresql-client python3
          version: 1.1
      - name: Verify PostgreSQL test tooling
        run: |
          command -v initdb
          command -v pg_ctl
          command -v psql
          initdb --version
      - run: cmake --version
      - run: cmake --preset dev
      - name: Confirm local PostgreSQL integration tests are registered
        run: |
          ctest --preset dev -N -L local | tee /tmp/ctest-local.txt
          grep -q 'DeliveryOptimizerApiAsyncTest.OptimizationJobsEndToEnd' /tmp/ctest-local.txt
      - run: cmake --build --preset dev
      - run: ctest --preset dev --output-on-failure -LE 'e2e|docker'
      - run: docker compose -f deploy/compose/docker-compose.arm64.yml --env-file deploy/env/http-server.arm64.env config
